; IBC Configuration for A.R.I.S Macro Overlay System
; IBC automates IB Gateway login — no manual interaction needed.
;
; Docs: https://github.com/IbcAlpha/IBC/blob/master/userguide.md

[IBGateway]
; Login credentials (injected via env vars in docker-compose)
IbLoginId=${IBKR_USERNAME}
IbPassword=${IBKR_PASSWORD}

; Trading mode: paper or live
TradingMode=${IBKR_TRADING_MODE}

; Accept non-brokerage account warning automatically
AcceptNonBrokerageAccountWarning=yes

; Accept incoming API connections (required for ib_insync)
AcceptIncomingConnectionAction=accept

; Existing session handling — let IBC take over
ExistingSessionDetectedAction=primary

; Auto-restart on Sunday for weekly maintenance
; (IBC handles this natively)
AutoRestartTime=00:00

; Read-only API — set to 'no' since we need to place orders
ReadOnlyApi=no

; Do NOT close gateway on Fridays (keep running for position checks)
ClosedownAt=

; Dismiss various IBKR popups automatically
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes

; Log file
LogToWindow=yes